name: marsemu
version: "0.1.0"
slug: marsemu
description: An emulated Marstek battery running its own firmware, with an X-ray dashboard
url: https://github.com/tomquist/marsemu
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:battery-charging-high
panel_title: marsemu
services:
  - mqtt:want
homeassistant_api: true
map:
  - addon_config:rw
options:
  image: ""
  mqtt: home_assistant
  house_load_entity: ""
  load_w: 400
  pv1_w: 300
  pv2_w: 300
  soc: 50
  extension_packs: 0
  speed: 1
  meter: local
schema:
  image: str?
  mqtt: list(home_assistant|offline)
  house_load_entity: str?
  load_w: int(0,10000)
  pv1_w: int(0,1000)
  pv2_w: int(0,1000)
  soc: int(1,100)
  extension_packs: int(0,2)
  speed: float(0,100)
  meter: str
